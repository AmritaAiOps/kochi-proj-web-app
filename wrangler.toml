name = "kochi-his-report"
pages_build_output_dir = "frontend/dist"
compatibility_date = "2026-10-01"

# Shared app state (MTD history, remembered Category Review choices, ...).
# Create once with:  npx wrangler kv namespace create STATE
# then paste the printed id below. See DEPLOY.docx.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
